name: Windows Packaging

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      GYP_MSVS_VERSION: 2022
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        channel: [direct, store]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup FFmpeg
        run: node scripts/setup-ffmpeg.js --arch=${{ matrix.arch }}

      - name: Release status snapshot
        shell: cmd
        run: |
          if not exist .tmp mkdir .tmp
          npm.cmd run release:status > .tmp\release-status.txt
          node scripts\release-status.js --format=markdown > .tmp\release-status.md
          node scripts\release-status.js --format=json > .tmp\release-status.json

      - name: Release automation gate
        shell: cmd
        run: npm.cmd run release:gate

      # - name: Lint
      #  run: npm run lint

      - name: Tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Dev smoke test
        if: matrix.channel == 'direct' && matrix.arch == 'x64'
        shell: cmd
        run: npm.cmd run test:smoke

      - name: Build direct-download package
        if: matrix.channel == 'direct' && matrix.arch == 'x64'
        run: npm run make:win-x64

      - name: Build direct-download package (ARM64)
        if: matrix.channel == 'direct' && matrix.arch == 'arm64'
        run: npm run make:win-arm64

      - name: Packaged smoke test
        if: matrix.channel == 'direct' && matrix.arch == 'x64'
        shell: cmd
        env:
          AGEOFSCREEN_SMOKE_PACKAGED_ARCH: x64
        run: npm.cmd run test:smoke:packaged

      - name: Upload smoke failure artifacts
        if: failure() && matrix.channel == 'direct' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v6
        with:
          name: smoke-debug-${{ matrix.arch }}
          path: .tmp/smoke-artifacts/**
          if-no-files-found: warn

      - name: Decode signing certificate
        if: matrix.channel == 'store'
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String("${{ secrets.WINDOWS_CERT_FILE }}")
          $certPath = Join-Path $env:RUNNER_TEMP "signing-cert.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          echo "DECODED_CERT_PATH=$certPath" >> $env:GITHUB_ENV

      - name: Build Store MSIX package
        if: matrix.channel == 'store' && matrix.arch == 'x64'
        env:
          WINDOWS_CERT_FILE: ${{ env.DECODED_CERT_PATH }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER }}
          WINDOWS_STORE_IDENTITY_NAME: ${{ secrets.WINDOWS_STORE_IDENTITY_NAME }}
        run: npm run make:store-win-x64

      - name: Build Store MSIX package (ARM64)
        if: matrix.channel == 'store' && matrix.arch == 'arm64'
        env:
          WINDOWS_CERT_FILE: ${{ env.DECODED_CERT_PATH }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          WINDOWS_PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER }}
          WINDOWS_STORE_IDENTITY_NAME: ${{ secrets.WINDOWS_STORE_IDENTITY_NAME }}
        run: npm run make:store-win-arm64

      - name: Audit packaged app size
        if: success()
        run: npm run audit:package-size

      - name: Upload MSIX for Store
        if: matrix.channel == 'store'
        uses: actions/upload-artifact@v6
        with:
          name: store-msix-${{ matrix.arch }}
          path: out/**/*.msix
          if-no-files-found: warn

      - name: Upload Direct Download Artifacts
        if: matrix.channel == 'direct'
        uses: actions/upload-artifact@v6
        with:
          name: windows-direct-${{ matrix.arch }}
          path: |
            out/make/zip/win32/${{ matrix.arch }}/*.zip
            out/make/squirrel.windows/${{ matrix.arch }}/*.exe
          if-no-files-found: warn

      - name: Upload release status snapshot
        if: always() && matrix.channel == 'direct' && matrix.arch == 'x64'
        uses: actions/upload-artifact@v6
        with:
          name: release-status-${{ matrix.arch }}
          path: |
            .tmp/release-status.txt
            .tmp/release-status.md
            .tmp/release-status.json
          if-no-files-found: warn

      - name: Publish release status summary
        if: always() && matrix.channel == 'direct' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          if (Test-Path ".tmp/release-status.md") {
            Get-Content ".tmp/release-status.md" | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }
